name: Deploy Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HONEYGUI_GITHUB_PAGES: "true"
      current_sdk_type: gui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          python -m pip install --upgrade pip
          python -m pip install -r doc/requirements.txt

      - name: Generate API reference
        working-directory: doc/doxyxml
        run: doxygen Doxyfile

      - name: Build English documentation
        env:
          current_language: en
        run: >-
          sphinx-build -b html -j auto doc/en site/en
          -D html_baseurl=https://realmcu.github.io/HoneyGUI/en/

      - name: Build Chinese documentation
        env:
          current_language: cn
        run: >-
          sphinx-build -b html -j auto doc/cn site/cn
          -D html_baseurl=https://realmcu.github.io/HoneyGUI/cn/

      - name: Prepare Pages root
        run: |
          cp doc/github-pages/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
